# Paper trading on a schedule, at no cost.
#
# GitHub runs one trading cycle every 15 minutes, commits the resulting state
# back to this repository, and publishes the dashboard to GitHub Pages. No
# server, no credit card, nothing to keep running.
#
# What this costs you in strategy quality is real and worth knowing: the loop
# runs every ~15 minutes instead of every 30 seconds, so stops and targets are
# checked far less often. On assets that can halve in minutes, that makes exits
# meaningfully worse. Treat the results as a pessimistic floor -- if the
# strategy works at this cadence, a faster one should do better, not worse.
#
# Minutes: a PUBLIC repository gets unlimited free Actions minutes. A private
# one gets 2,000/month on the Free plan, so raise the interval to 30 minutes
# (cron "*/30 * * * *") to stay inside it.

name: Paper trade

on:
  schedule:
    # Every five minutes -- GitHub's floor -- offset away from the top of the
    # hour, where the scheduler is busiest.
    #
    # This is not because the bot needs a five-minute cadence. GitHub's
    # scheduler is best-effort and drops runs silently under load: of the
    # first four scheduled firings here, one arrived. Asking more often is
    # the only lever, since a dropped run leaves no trace and cannot be
    # retried. A public repository has unlimited minutes and a cycle now
    # takes well under a minute, so the extra attempts cost nothing.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:        # lets you trigger a run by hand from the phone

# One run at a time. Two cycles writing the same database would corrupt the
# position ledger.
concurrency:
  group: paper-trade
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Run 4 was killed at 10 minutes by the one-request-per-token discovery.
    # Batching fixed the cause; this is headroom so a slow API cannot silently
    # cost a whole cycle.
    # Fifteen minutes of cycling plus checkout, commit and headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run one trading cycle
        env:
          MEMEBOT_MODE: paper
          MEMEBOT_BANKROLL_USD: "1000"
          # Aggressive: 5% per trade, 8 slots, 35% stop, 3x target, 20% daily
          # cap. Sizing scales whatever edge exists -- in both directions.
          MEMEBOT_PROFILE: aggressive
          MEMEBOT_POLL_SECONDS: "45"
          MEMEBOT_DB_PATH: state/trading.sqlite3
          # Cycling every 45 seconds within a run, but runs themselves are
          # roughly hourly, so a position can still go unwatched for a while.
          # The hold stays long enough to survive those gaps.
          MEMEBOT_MAX_HOLD_SECONDS: "43200"
        # Cycle for fifteen minutes inside one invocation rather than once.
        # GitHub honours roughly one scheduled firing an hour however often
        # it is asked, so the way to cycle often is to do more per firing.
        # At a 45-second poll that is ~20 cycles per run instead of 1.
        run: python -m memecoin_bot run --minutes 15 --out docs/state.json

      - name: Commit state
        run: |
          git config user.name "paper-trade-bot"
          git config user.email "actions@github.com"

          # The database is this bot's only memory between cycles: a run
          # starts from a fresh checkout, so anything not committed is
          # forgotten. It was silently excluded by a .gitignore rule for
          # several runs, which reset the bankroll and would have orphaned
          # any open position. Fail loudly rather than repeat that.
          if git check-ignore -q state/trading.sqlite3; then
            echo "::error::state/trading.sqlite3 is gitignored; the bot" \
                 "would lose every position and reset its bankroll."
            exit 1
          fi

          git add -A state docs
          if ! git diff --staged --name-only | grep -q "state/trading.sqlite3"; then
            echo "::warning::database unchanged this cycle"
          fi

          if git diff --staged --quiet; then
            echo "nothing changed this cycle"
          else
            git commit -m "Paper trading cycle $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Another cycle may have pushed while this one ran.
            git pull --rebase --autostash origin main || true
            git push
          fi

  publish:
    needs: cycle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
